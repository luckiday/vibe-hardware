# voice-buddy — the part & net table (pcblib's single net source).
#
# BOTH gen_sch.py (symbols + ERC) and gen_pcb.py (copper nets) derive from this
# file, so the schematic and the board cannot drift apart.
#
# v2 architecture: ONE ES8388 duplex codec (QFN-28 0.45mm) replaces the v1
# ES8311+ES7210 pair (two 0.4mm QFNs) — escape-routing co-design. L-ADC = the
# single analog MEMS mic, R-ADC = the amp echo reference (hardware AEC, the
# xiaozhi yunliao-s3 pattern). Pad->net map follows the ES8388 datasheet
# Rev 5.0 pin table (pins verified 2026-07-13 against the Everest datasheet +
# Olimex ESP32-ADF + Ai-Thinker ESP32-A1S schematics; see voicebuddy_brief.md
# §2/§10 for the verification record).
#
# Net naming: +5V (VBUS), +3V3 (LDO), +3V3A (ferrite-filtered analog rail:
# AVDD+HPVDD, mic supply), GND; I2S_*/I2C_* per pinmap.yaml; audio path
# OUTP (LOUT1) -> C14 -> AMP_INN (Audio-Kit NS4150 pattern, IN+ AC-grounded);
# AEC_REF = OUTP divided (R8/R9) + 1u coupled into RIN1.

power_nets: ["+5V", "+3V3", "+3V3A", GND]

parts:
  # ---------------- MCU module ----------------
  U1:
    footprint: RF_Module:ESP32-S3-WROOM-1
    value: ESP32-S3-WROOM-1-N16R8
    cluster: MCU
    lcsc: C2913202
    pins:
      1: GND
      2: +3V3
      3: EN
      10: I2S_MCLK    # IO17 \
      11: I2S_BCLK    # IO18  | codec bus on the module's lower-left pads
      12: I2S_WS      # IO8   | (placement-driven GPIO plan; see pinmap.yaml)
      13: USB_DN      # IO19 (fixed silicon)
      14: USB_DP      # IO20 (fixed silicon)
      17: I2S_DOUT    # IO9  -> ES8388 DSDIN
      18: I2S_DIN     # IO10 <- ES8388 ASDOUT
      19: I2C_SDA     # IO11
      20: I2C_SCL     # IO12
      21: PA_EN       # IO13
      23: BTN_VOLDN   # IO21
      24: BTN_VOLUP   # IO47
      27: BTN_BOOT    # IO0  (strap — the button)
      31: LED_DATA    # IO38
      40: GND
      41: GND         # thermal pad
    pin_types: { 2: power_in, 1: power_in, 40: power_in, 41: passive }

  # ---------------- audio: duplex codec ----------------
  U2:
    footprint: Package_DFN_QFN:QFN-28-1EP_4x4mm_P0.45mm_EP2.6x2.6mm
    value: ES8388
    cluster: AUDIO
    lcsc: C365736
    pins:
      1: I2S_MCLK     # MCLK
      2: +3V3         # DVDD
      3: +3V3         # PVDD
      4: GND          # DGND
      5: I2S_BCLK     # SCLK
      6: I2S_DOUT     # DSDIN (DAC data in)
      7: I2S_WS       # LRCK (one pin for ADC+DAC — reg43 slrck=1)
      8: I2S_DIN      # ASDOUT (ADC data out)
      9: NC
      10: VREF        # decoupling cap
      11: NC          # ROUT1 (mono: LOUT1 only)
      12: OUTP        # LOUT1 -> NS4150 (Audio-Kit pattern)
      13: GND         # HPGND
      14: NC          # ROUT2
      15: NC          # LOUT2 (headphone pair unused)
      16: +3V3A       # HPVDD (shares the filtered analog rail with AVDD)
      17: +3V3A       # AVDD
      18: GND         # AGND
      19: VREF_ADC    # ADCVREF decouple
      20: VMID        # mid-rail decouple
      21: NC          # RIN2
      22: NC          # LIN2
      23: AEC_REF     # RIN1 <- attenuated LOUT1 (echo reference; R-ADC)
      24: MIC_IN      # LIN1 <- MEMS mic, AC-coupled (L-ADC)
      25: NC
      26: ES8388_CE   # CE: 10k to GND -> I2C 7-bit 0x10 (never drive from MCU)
      27: I2C_SDA     # CDATA
      28: I2C_SCL     # CCLK
      29: GND         # EP (datasheet/Olimex: tie to GND)
    pin_types: { 2: power_in, 3: power_in, 16: power_in, 17: power_in }

  # ---------------- audio: class-D amp ----------------
  U4:
    footprint: Package_SO:SOIC-8-1EP_3.9x4.9mm_P1.27mm_EP2.29x3mm
    value: NS4150B
    cluster: AUDIO
    lcsc: C189961
    pins:
      1: AMP_INN      # IN-  <- C14 <- OUTP (single-ended, Audio-Kit wiring)
      2: AMP_INP      # IN+  AC-grounded via C15
      3: PA_EN        # SD/CTRL: high = play (100k pulldown keeps it silent at boot)
      4: GND
      5: SPK_P        # VO+
      6: +5V          # VDD
      7: GND
      8: SPK_N        # VO-
      9: GND          # EP
    pin_types: { 6: power_in }

  # ---------------- power ----------------
  U5:
    footprint: Package_TO_SOT_SMD:SOT-223-3_TabPin2
    value: AMS1117-3.3
    cluster: PWR
    lcsc: C6186
    pins: { 1: GND, 2: +3V3, 3: +5V }
    pin_types: { 2: power_out, 3: power_in }
  U6:
    footprint: Package_TO_SOT_SMD:SOT-23-6
    value: USBLC6-2SC6
    cluster: PWR
    lcsc: C7519
    pins: { 1: USB_DN, 2: GND, 3: USB_DP, 4: USB_DP, 5: +5V, 6: USB_DN }

  # ---------------- microphone (back side, port through PCB) ----------------
  MK1:
    footprint: voicebuddy:MEMS_Analog_BottomPort_3.76x2.95
    value: MSM381A3729
    cluster: MIC
    pins: { 1: MIC_OUT, 2: GND, 3: MIC_VDD, 4: GND }

  # ---------------- connectors ----------------
  J1:
    footprint: Connector_USB:USB_C_Receptacle_HRO_TYPE-C-31-M-12
    value: USB-C-16P
    cluster: PWR
    lcsc: C165948
    pins:
      A1: GND
      A4: +5V
      A5: CC1
      A6: USB_DP
      A7: USB_DN
      A8: NC
      A9: +5V
      A12: GND
      B1: GND
      B4: +5V
      B5: CC2
      B6: USB_DP
      B7: USB_DN
      B8: NC
      B9: +5V
      B12: GND
      SH: GND
  J2:
    footprint: Connector_JST:JST_PH_B2B-PH-K_1x02_P2.00mm_Vertical
    value: SPK-4ohm-3W
    cluster: AUDIO
    pins: { 1: SPK_P, 2: SPK_N }
  J3:
    footprint: Connector_PinSocket_2.54mm:PinSocket_1x04_P2.54mm_Vertical
    value: OLED-SSD1306-0.96
    cluster: UI
    pins: { 1: GND, 2: +3V3, 3: I2C_SCL, 4: I2C_SDA }

  # ---------------- HMI ----------------
  SW1:
    footprint: Button_Switch_SMD:SW_SPST_PTS645Sx43SMTR92
    value: BOOT
    cluster: UI
    pins: { 1: BTN_BOOT, 2: GND }
  SW2:
    footprint: Button_Switch_SMD:SW_SPST_PTS645Sx43SMTR92
    value: VOL-
    cluster: UI
    pins: { 1: BTN_VOLDN, 2: GND }
  SW3:
    footprint: Button_Switch_SMD:SW_SPST_PTS645Sx43SMTR92
    value: VOL+
    cluster: UI
    pins: { 1: BTN_VOLUP, 2: GND }
  D1:
    footprint: LED_SMD:LED_WS2812B_PLCC4_5.0x5.0mm_P3.2mm
    value: WS2812B
    cluster: UI
    pins: { 1: +3V3, 2: LED_OUT, 3: GND, 4: LED_DATA }

  # ---------------- R (0603) ----------------
  R1: { footprint: "Resistor_SMD:R_0603_1608Metric", value: 5.1k, cluster: PWR, pins: { 1: CC1, 2: GND } }
  R2: { footprint: "Resistor_SMD:R_0603_1608Metric", value: 5.1k, cluster: PWR, pins: { 1: CC2, 2: GND } }
  R3: { footprint: "Resistor_SMD:R_0603_1608Metric", value: 4.7k, cluster: MCU, pins: { 1: +3V3, 2: I2C_SDA } }
  R4: { footprint: "Resistor_SMD:R_0603_1608Metric", value: 4.7k, cluster: MCU, pins: { 1: +3V3, 2: I2C_SCL } }
  R5: { footprint: "Resistor_SMD:R_0603_1608Metric", value: 10k, cluster: MCU, pins: { 1: +3V3, 2: BTN_BOOT } }
  R6: { footprint: "Resistor_SMD:R_0603_1608Metric", value: 10k, cluster: MCU, pins: { 1: +3V3, 2: EN } }
  R7: { footprint: "Resistor_SMD:R_0603_1608Metric", value: 100k, cluster: AUDIO, pins: { 1: PA_EN, 2: GND } }
  R8: { footprint: "Resistor_SMD:R_0603_1608Metric", value: 47k, cluster: AUDIO, pins: { 1: OUTP, 2: AEC_IN }, notes: "AEC ref attenuator (values EST)" }
  R9: { footprint: "Resistor_SMD:R_0603_1608Metric", value: 4.7k, cluster: AUDIO, pins: { 1: AEC_IN, 2: GND } }
  R10: { footprint: "Resistor_SMD:R_0603_1608Metric", value: 1k, cluster: MIC, pins: { 1: +3V3A, 2: MIC_VDD }, notes: "mic supply filter (A1S MBIAS pattern: 1k + 10u)" }
  R12: { footprint: "Resistor_SMD:R_0603_1608Metric", value: 10k, cluster: AUDIO, pins: { 1: ES8388_CE, 2: GND } }

  # ---------------- FB / C ----------------
  FB1: { footprint: "Inductor_SMD:L_0805_2012Metric", value: "FB 600R@100MHz", cluster: AUDIO, pins: { 1: +3V3, 2: +3V3A } }
  C1: { footprint: "Capacitor_SMD:C_0805_2012Metric", value: 22u, cluster: PWR, pins: { 1: +5V, 2: GND }, notes: "VBUS bulk" }
  C2: { footprint: "Capacitor_SMD:C_0805_2012Metric", value: 22u, cluster: AUDIO, pins: { 1: +5V, 2: GND }, notes: "amp bulk, at U4" }
  C3: { footprint: "Capacitor_SMD:C_0603_1608Metric", value: 10u, cluster: PWR, pins: { 1: +5V, 2: GND }, notes: "LDO in" }
  C4: { footprint: "Capacitor_SMD:C_0805_2012Metric", value: 22u, cluster: PWR, pins: { 1: +3V3, 2: GND }, notes: "LDO out" }
  C5: { footprint: "Capacitor_SMD:C_0603_1608Metric", value: 100n, cluster: MCU, pins: { 1: +3V3, 2: GND } }
  C6: { footprint: "Capacitor_SMD:C_0603_1608Metric", value: 10u, cluster: MCU, pins: { 1: +3V3, 2: GND } }
  C7: { footprint: "Capacitor_SMD:C_0603_1608Metric", value: 1u, cluster: MCU, pins: { 1: EN, 2: GND }, notes: "EN RC" }
  C8: { footprint: "Capacitor_SMD:C_0603_1608Metric", value: 100n, cluster: AUDIO, pins: { 1: +3V3, 2: GND }, notes: "U2 DVDD/PVDD" }
  C9: { footprint: "Capacitor_SMD:C_0603_1608Metric", value: 100n, cluster: AUDIO, pins: { 1: +3V3A, 2: GND }, notes: "U2 AVDD/HPVDD" }
  C10: { footprint: "Capacitor_SMD:C_0603_1608Metric", value: 10u, cluster: AUDIO, pins: { 1: +3V3A, 2: GND }, notes: "analog rail bulk" }
  C11: { footprint: "Capacitor_SMD:C_0603_1608Metric", value: 10u, cluster: AUDIO, pins: { 1: VMID, 2: GND }, notes: "Olimex: 10u on VMID/VREF/ADCVREF" }
  C12: { footprint: "Capacitor_SMD:C_0603_1608Metric", value: 10u, cluster: AUDIO, pins: { 1: VREF, 2: GND } }
  C13: { footprint: "Capacitor_SMD:C_0603_1608Metric", value: 10u, cluster: AUDIO, pins: { 1: VREF_ADC, 2: GND } }
  C14: { footprint: "Capacitor_SMD:C_0603_1608Metric", value: 1u, cluster: AUDIO, pins: { 1: OUTP, 2: AMP_INN }, notes: "line out coupling (A-K C24)" }
  C15: { footprint: "Capacitor_SMD:C_0603_1608Metric", value: 100n, cluster: AUDIO, pins: { 1: AMP_INP, 2: GND }, notes: "IN+ AC ground (A-K C1)" }
  C16: { footprint: "Capacitor_SMD:C_0603_1608Metric", value: 1u, cluster: AUDIO, pins: { 1: AEC_IN, 2: AEC_REF }, notes: "line-level -> 1u -> RIN1 (DS app circuit)" }
  C17: { footprint: "Capacitor_SMD:C_0603_1608Metric", value: 10u, cluster: MIC, pins: { 1: MIC_VDD, 2: GND } }
  C18: { footprint: "Capacitor_SMD:C_0603_1608Metric", value: 100n, cluster: MIC, pins: { 1: MIC_OUT, 2: MIC_IN }, notes: "mic AC coupling" }
  C19: { footprint: "Capacitor_SMD:C_0603_1608Metric", value: 100n, cluster: AUDIO, pins: { 1: +5V, 2: GND }, notes: "U4 VDD hf" }
  C20: { footprint: "Capacitor_SMD:C_0603_1608Metric", value: 100n, cluster: UI, pins: { 1: +3V3, 2: GND }, notes: "D1" }
