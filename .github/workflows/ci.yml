name: ci

on:
  push:
    branches: [main]
    tags: ['*-v*']        # release tags: <example>-v<version> (e.g. pager-buddy-v1.2.3)
  pull_request:
  workflow_dispatch:
    inputs:
      example:
        description: Example directory under examples/ to firmware-build
        required: false
        default: pager-buddy

# Least privilege. The firmware job re-grants actions:write for artifact upload.
permissions:
  contents: read

# Cancel stale PR runs; never cancel a tag / manual firmware build mid-upload.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Skill structure (SKILL.md + name: + use when)"
        run: |
          fail=0
          for d in skills/*/; do
            [ -f "$d/SKILL.md" ] || { echo "::error::missing SKILL.md in $d"; fail=1; continue; }
            grep -q '^name:' "$d/SKILL.md" || { echo "::error::no 'name:' frontmatter in $d/SKILL.md"; fail=1; }
            grep -qi 'use when' "$d/SKILL.md" || { echo "::error::no 'use when' in $d/SKILL.md"; fail=1; }
          done
          [ "$fail" = 0 ] && echo "OK: every skill has SKILL.md + name: + use when"
          exit $fail

      - name: Python scripts compile
        run: |
          find skills examples tools -name '*.py' -print0 \
            | xargs -0 -r python3 -m py_compile
          echo "OK: python scripts compile"

      - name: PLM gate (every example product.yaml)
        run: |
          fail=0
          shopt -s nullglob
          found=0
          for f in examples/*/product.yaml; do
            found=1
            python3 skills/vibe-plm/scripts/plm_check.py "$f" || fail=1
          done
          [ "$found" = 1 ] || { echo "::error::no examples/*/product.yaml found"; fail=1; }
          exit $fail

      - name: Docs are global-developer friendly (translations welcome)
        run: |
          # This repo is built by developers all over the world, and non-English text is
          # NOT banned. Legitimate uses are common: a pronunciation fixture in code (see
          # vibe-voice's zh/ja/ko preflight samples), a quoted user-facing string, a
          # transcript in an example, or a full translation of a doc.
          #
          # What we do keep is a shared entry point. English is the lingua franca of the
          # top-level docs so any contributor can get oriented; a translation lives BESIDE
          # its English original with a language suffix — README.zh.md, docs/manual.ja.md —
          # rather than silently replacing it.
          #
          # Hard failure: a localized doc whose English original is missing.
          # Advisory: a normal doc that reads as mostly non-English — it probably wants to
          # be a *.<lang>.md sitting next to an English one.
          python3 - <<'PY'
          import re, sys
          from pathlib import Path

          LOCALIZED = re.compile(r"\.[a-z]{2}(-[A-Za-z]{2,4})?\.md$")
          CJK = re.compile(r"[぀-ヿ一-鿿가-힯]")
          LATIN = re.compile(r"[A-Za-z]")

          docs = [p for p in Path(".").rglob("*.md") if ".git" not in p.parts]
          fail = False

          for p in docs:
              if not LOCALIZED.search(p.name):
                  continue
              original = p.with_name(LOCALIZED.sub(".md", p.name))
              if not original.exists():
                  print(f"::error::{p} is a translation with no English original at {original}")
                  fail = True

          for p in docs:
              if LOCALIZED.search(p.name):
                  continue
              text = p.read_text(encoding="utf-8", errors="replace")
              cjk, latin = len(CJK.findall(text)), len(LATIN.findall(text))
              # A CJK character carries far more than a latin letter, so weight it ~4x
              # before calling a doc "mostly non-English".
              if cjk and cjk * 4 > latin:
                  print(f"::warning file={p}::mostly non-English -- consider naming it "
                        f"{p.with_suffix('')}.<lang>.md beside an English original")

          if not fail:
              print("OK: every translation has an English original; "
                    "non-English text is welcome elsewhere")
          sys.exit(1 if fail else 0)
          PY

      - name: pager-buddy bridge smoke
        run: examples/pager-buddy/bridge/smoke.sh

      - name: Shellcheck
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y shellcheck
          fi
          find skills examples tools docs -name '*.sh' -print0 \
            | xargs -0 -r shellcheck -S warning

  # Build an example's firmware on a release tag named "<example>-v<version>"
  # (e.g. pager-buddy-v1.2.3), or via workflow_dispatch. Never on branch pushes
  # or PRs — firmware builds are slow and only meaningful for a cut release /
  # a deliberate check. Runs in the SAME pinned ESP-IDF Docker image the
  # example's idf.sh uses, so CI artifacts match a local reproducible build.
  firmware:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve example from the tag or dispatch input
        id: ex
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_EXAMPLE: ${{ inputs.example }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            name="$INPUT_EXAMPLE"
            tag="dispatch"
          else
            tag="$GITHUB_REF_NAME"            # e.g. pager-buddy-v1.2.3
            name="${tag%-v*}"                 # strip -v<version> -> pager-buddy
            if [ "$name" = "$tag" ] || [ -z "$name" ]; then
              echo "::error::tag '$tag' is not of the form '<example>-v<version>'"; exit 1
            fi
          fi
          # Keep the path under examples/<name>/firmware — no slashes, dots, or empties.
          if ! [[ "$name" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::invalid example name '$name'"; exit 1
          fi
          dir="examples/$name/firmware"
          if [ ! -d "$dir" ]; then
            echo "::error::no firmware for example '$name' (expected $dir)"; exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "dir=$dir"   >> "$GITHUB_OUTPUT"
          echo "tag=$tag"   >> "$GITHUB_OUTPUT"
          echo "Building '$name' firmware ($dir) for $tag"

      - name: Build firmware (pinned ESP-IDF Docker)
        run: |
          # Same image + user mapping as examples/<name>/firmware/idf.sh.
          # No -t: GitHub-hosted runners have no TTY.
          TAG="${IDF_DOCKER_TAG:-v5.5}"
          docker run --rm \
            -v "$PWD/${{ steps.ex.outputs.dir }}":/project -w /project \
            -u "$(id -u):$(id -g)" -e HOME=/tmp \
            "espressif/idf:$TAG" \
            idf.py build

      - name: Size report
        run: ls -l "${{ steps.ex.outputs.dir }}/build/"*.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ex.outputs.name }}-${{ steps.ex.outputs.tag }}
          path: |
            ${{ steps.ex.outputs.dir }}/build/*.bin
            ${{ steps.ex.outputs.dir }}/build/bootloader/bootloader.bin
            ${{ steps.ex.outputs.dir }}/build/partition_table/partition-table.bin
            ${{ steps.ex.outputs.dir }}/build/flasher_args.json
          if-no-files-found: error
